services:
  api:
    build: .
    ports:
      - "7023:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SharboDbConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-sharbodb};Username=${POSTGRES_USER:-sharbo_user};Password=${POSTGRES_PASSWORD:-sharbo_dev}
      Firebase__Credentials: ${FIREBASE_CREDENTIALS:-}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharbo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharbo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sharbodb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
